<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>C++ Level 5</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="text-white min-h-screen flex items-center justify-center p-4" style="background: radial-gradient(circle at top left, #1e3a8a, #000);">

  <div class="bg-black/30 backdrop-blur-lg p-8 rounded-2xl max-w-xl w-full shadow-xl border border-white/10 text-center">
    <h1 class="text-3xl font-bold mb-6">💻 C++ - Level 5</h1>
    <div id="quiz-area">
      <h2 id="question" class="text-xl font-semibold mb-4">Loading...</h2>
      <div id="options" class="space-y-2 mb-6"></div>
    </div>
  </div>

  <script>
    const questions = [
      {
        q: "Which of the following is used to make a class abstract in C++?",
        options: ["At least one pure virtual function", "A constructor", "Private inheritance", "Virtual destructor"],
        correct: "At least one pure virtual function"
      },
      {
        q: "What will be the output of: `cout << 5 / 2;` in C++?",
        options: ["2.5", "2", "2.0", "Compilation Error"],
        correct: "2"
      },
      {
        q: "Which of the following is not a type of inheritance in C++?",
        options: ["Multiple", "Multilevel", "Parallel", "Hierarchical"],
        correct: "Parallel"
      },
      {
        q: "What is the size of a `bool` variable in C++?",
        options: ["1 byte", "2 bytes", "4 bytes", "Depends on compiler"],
        correct: "1 byte"
      },
      {
        q: "Which of the following correctly declares a pointer to a function?",
        options: ["int (*ptr)(int, int);", "int ptr*(int, int);", "int *ptr(int, int);", "function<int(int,int)> ptr;"],
        correct: "int (*ptr)(int, int);"
      }
    ];

    let current = 0;
    let score = 0;

    function loadNextQuestion() {
      if (current >= questions.length) {
        const quizArea = document.getElementById("quiz-area");

        if (score === questions.length) {
          quizArea.innerHTML = `
            <h2 class="text-2xl font-bold text-green-400 mb-4">🏆 Game Completed!</h2>
            <p class="mb-6">Your Score: ${score}/${questions.length}</p>
            <p class="text-yellow-400 font-bold mb-4">🎉 Congratulations, C++ Master!</p>
            <a href="main.html" class="inline-block bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded-full text-white font-bold mb-4">🏅 View Home</a><br>
            <a href="lang.html" class="inline-block bg-purple-700 hover:bg-purple-800 px-6 py-2 rounded-full font-bold">Back to Languages</a>
          `;
        } else {
          quizArea.innerHTML = `
            <h2 class="text-2xl font-bold text-red-500 mb-4">❌ Level 5 Failed!</h2>
            <p class="mb-6">Your Score: ${score}/${questions.length}</p>
            <a href="cpplevel5.html" class="inline-block bg-red-600 hover:bg-red-700 px-6 py-2 rounded-full font-bold text-white mb-4">🔁 Retry Level</a><br>
            <a href="lang.html" class="inline-block bg-purple-700 hover:bg-purple-800 px-6 py-2 rounded-full font-bold">Back to Languages</a>
          `;
        }
        return;
      }

      const q = questions[current];
      document.getElementById("question").innerText = `Q${current + 1}. ${q.q}`;
      const optionsHTML = q.options.map(option => `
        <button onclick="checkAnswer('${option}')" class="bg-white text-black font-semibold px-4 py-2 rounded-lg w-full hover:bg-yellow-100 transition">
          ${option}
        </button>
      `).join("");

      document.getElementById("options").innerHTML = optionsHTML;
    }

    function checkAnswer(selected) {
      const correct = questions[current].correct;
      if (selected === correct) {
        score++;
      }
      current++;
      loadNextQuestion();
    }

    loadNextQuestion();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodePlay | Game Arena</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Orbitron', sans-serif;
      background: radial-gradient(circle at center, #000000 0%, #1a1a1a 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .header {
      text-align: center;
      margin: 20px;
    }
    .header h1 {
      font-size: 2.2rem;
      color: #00ffcc;
      animation: pulseTitle 1.5s infinite alternate;
    }
    @keyframes pulseTitle {
      from { transform: scale(1); color: #00ffcc; }
      to { transform: scale(1.05); color: #00ffff; }
    }
    .stats-bar {
      display: flex;
      justify-content: space-around;
      background: #222;
      padding: 10px 20px;
      width: 100%;
      max-width: 1000px;
      border-radius: 10px;
      margin-top: 10px;
    }
    .stats-bar div {
      color: #00ffcc;
      font-size: 1rem;
    }
    .challenge-box {
      background: #2e2e2e;
      border: 2px dashed #00ffcc;
      border-radius: 10px;
      padding: 15px;
      margin-top: 10px;
      text-align: center;
      width: 90%;
      max-width: 1000px;
      animation: bounceIn 0.8s ease-in-out;
    }
    @keyframes bounceIn {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .challenge-box h3 {
      color: #00ffcc;
      margin-bottom: 5px;
    }
    .timer {
      font-size: 1.2rem;
      margin-top: 10px;
      color: #ff5757;
    }
    .game-container {
      display: flex;
      justify-content: space-between;
      width: 90%;
      max-width: 1100px;
      margin-top: 20px;
      gap: 20px;
    }
    .player-box {
      flex: 1;
      background: #2c2c2c;
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
    }
    .player-box h2 {
      margin-bottom: 10px;
      font-size: 1.5rem;
    }
    .code-area {
      background: #1e1e1e;
      border: 2px solid #00ffcc;
      border-radius: 10px;
      padding: 10px;
      color: #00ffcc;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      height: 200px;
      width: 100%;
      resize: none;
    }
    .vs-box {
      align-self: center;
      font-size: 2.2rem;
      padding: 20px;
      color: #00ffcc;
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.2); }
    }
    .submit-btn {
      margin-top: 10px;
      padding: 10px 20px;
      border: none;
      background: #00ffcc;
      color: #000;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }
    .submit-btn:hover {
      background: #00ffff;
    }
    .feedback {
      margin-top: 10px;
      font-size: 1rem;
      color: #ffcc00;
    }
    .footer {
      margin-top: auto;
      padding: 15px;
      text-align: center;
      color: #999;
    }
    .game-over {
      margin-top: 30px;
      font-size: 1.8rem;
      color: #ffcc00;
      animation: bounceIn 1s;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔥 CodePlay Game Arena 🔥</h1>
    <p>Battle with your friend, gain XP, and conquer challenges!</p>
  </div>

  <div class="stats-bar">
    <div>Player 1 XP: <span id="xp1">0</span></div>
    <div>❤️ Lives: <span id="lives">3</span></div>
    <div>Player 2 XP: <span id="xp2">0</span></div>
  </div>

  <div class="challenge-box">
    <h3 id="challenge">Challenge: Write a function to reverse a string</h3>
    <div class="timer" id="timer">Time Left: 60s</div>
  </div>

  <div class="game-container">
    <div class="player-box">
      <h2>👦 Player 1</h2>
      <textarea class="code-area" id="code1" placeholder="Write your code here..."></textarea>
      <button class="submit-btn" onclick="submitCode(1)">Submit</button>
      <div class="feedback" id="feedback1"></div>
    </div>

    <div class="vs-box">VS</div>

    <div class="player-box">
      <h2>👧 Player 2</h2>
      <textarea class="code-area" id="code2" placeholder="Write your code here..."></textarea>
      <button class="submit-btn" onclick="submitCode(2)">Submit</button>
      <div class="feedback" id="feedback2"></div>
    </div>
  </div>

  <div id="gameResult" class="game-over"></div>

  <div class="footer">
    © 2025 CodePlay | Powered by Imagination & Logic
  </div>

  <script>
    const challenges = [
      "Write a function to reverse a string",
      "Check if a number is prime",
      "Write a function to find factorial",
      "Check if a string is a palindrome",
      "Find the largest number in an array"
    ];

    let currentChallenge = 0;
    let seconds = 60;
    const timerEl = document.getElementById("timer");
    const xp1 = document.getElementById("xp1");
    const xp2 = document.getElementById("xp2");
    const lives = document.getElementById("lives");
    const challengeEl = document.getElementById("challenge");
    const resultEl = document.getElementById("gameResult");

    let xpScore = [0, 0];
    let playerLives = 3;

    const countdown = setInterval(() => {
      seconds--;
      timerEl.textContent = `Time Left: ${seconds}s`;
      if (seconds <= 0) {
        clearInterval(countdown);
        timerEl.textContent = "⏱️ Time's Up!";
        endGame();
      }
    }, 1000);

    function submitCode(player) {
      const code = document.getElementById(`code${player}`).value;
      const feedback = document.getElementById(`feedback${player}`);
      const challenge = challenges[currentChallenge];

      const correctKeywords = ["reverse", "split", "prime", "factorial", "palindrome", "max", "Math"];
      let isCorrect = correctKeywords.some(keyword => code.includes(keyword));

      if (isCorrect) {
        feedback.textContent = "✅ Correct! +10 XP";
        xpScore[player - 1] += 10;
        currentChallenge = (currentChallenge + 1) % challenges.length;
        challengeEl.textContent = `Challenge: ${challenges[currentChallenge]}`;
      } else {
        feedback.textContent = "❌ Incorrect! -1 Life";
        playerLives--;
        lives.textContent = playerLives;
        if (playerLives <= 0) {
          endGame();
        }
      }

      xp1.textContent = xpScore[0];
      xp2.textContent = xpScore[1];
    }

    function endGame() {
      let winner = xpScore[0] > xpScore[1] ? "Player 1 Wins!" : xpScore[1] > xpScore[0] ? "Player 2 Wins!" : "It's a Draw!";
      resultEl.innerHTML = `🎮 Game Over! <br> 🏆 ${winner}`;
    }
  </script>
</body>
</html>

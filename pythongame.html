<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Python Level 1</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class=" text-white min-h-screen flex items-center justify-center p-4" style="background: radial-gradient(circle at top left, #1e3a8a, #000);">

  <div class="bg-black/30 backdrop-blur-lg p-8 rounded-2xl max-w-xl w-full shadow-xl border border-white/10 text-center">
    <h1 class="text-3xl font-bold mb-6">🐍 Python - Level 1</h1>
    <div id="quiz-area">
      <h2 id="question" class="text-xl font-semibold mb-4">Loading...</h2>
      <div id="options" class="space-y-2 mb-6"></div>
      <button onclick="loadNextQuestion()" id="next-btn" class="-500 text-black px-6 py-2 rounded-full font-bold hover:bg-yellow-600 transition">
    
      </button>
    </div>
  </div>

  <script>
    const questions = [
      {
        q: "What is the output of print(2 ** 3)?",
        options: ["6", "8", "9", "Error"],
        correct: "8"
      },
      {
        q: "Which keyword is used to define a function in Python?",
        options: ["def", "function", "lambda", "define"],
        correct: "def"
      },
      {
        q: "What does len('Python') return?",
        options: ["5", "6", "7", "Error"],
        correct: "6"
      }
    ];

    let current = 0;
    let score = 0;

    function loadNextQuestion() {
      if (current >= questions.length) {
  const quizArea = document.getElementById("quiz-area");
  
  if (score === questions.length) {
    // Show success only if full score
    quizArea.innerHTML = `
      <h2 class="text-2xl font-bold text-green-400 mb-4">🎉 Level 1 Completed!</h2>
      <p class="mb-6">Your Score: ${score}/${questions.length}</p>
      <a href="pythonlevel2.html" class="inline-block bg-blue-500 px-6 py-2 rounded-full font-bold text-white hover:bg-blue-600 mb-4">🔓 Unlock Level 2</a><br>
      <a href="lang.html" class="inline-block bg-purple-700 hover:bg-purple-800 px-6 py-2 rounded-full font-bold">Back to Languages</a>
    `;
  } else {
    // Show failure and retry option
    quizArea.innerHTML = `
      <h2 class="text-2xl font-bold text-red-500 mb-4">❌ Level 1 Failed!</h2>
      <p class="mb-6">Your Score: ${score}/${questions.length}</p>
      <a href="pythongame.html" class="inline-block bg-red-600 hover:bg-red-700 px-6 py-2 rounded-full font-bold text-white mb-4">🔁 Retry Level</a><br>
      <a href="lang.html" class="inline-block bg-purple-700 hover:bg-purple-800 px-6 py-2 rounded-full font-bold">Back to Languages</a>
    `;
  }
  return;
}


      const q = questions[current];
      document.getElementById("question").innerText = `Q${current + 1}. ${q.q}`;

      const optionsHTML = q.options.map(option => `
        <button onclick="checkAnswer('${option}')" class="bg-white text-black font-semibold px-4 py-2 rounded-lg w-full hover:bg-yellow-100 transition">
          ${option}
        </button>
      `).join("");

      document.getElementById("options").innerHTML = optionsHTML;
    }

    function checkAnswer(selected) {
      const correct = questions[current].correct;
      if (selected === correct) {
        score++;
      }

      current++;
      loadNextQuestion();
    }

    // Load the first question
    loadNextQuestion();
  </script>
</body>
</html>
